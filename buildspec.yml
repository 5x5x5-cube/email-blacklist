version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - pip install -r requirements.txt
      - pip install pytest
  pre_build:
    commands:
      - echo "Ejecutando pruebas unitarias..."
      - pytest tests/
  build:
    commands:
      - echo "Generando artefacto..."
      - zip -r artifact.zip .

artifacts:
  files:
    - artifact.zip
  discard-paths: yes
