version: 0.2

env:
  variables:
    PROJECT_DIR: blacklist_app
    UNIT_TESTS_DIR: blacklist_app/tests/unit
    ECR_REPO: blacklist
    REGION: us-east-1
    IMAGE_TAG: latest
    CONTAINER_NAME: blacklist-container
    ACCOUNT_ID: 982590066260

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo "Instalando dependencias..."
      - python -m pip install --upgrade pip
      - python -m pip install poetry
      - cd ${PROJECT_DIR}
      - poetry config virtualenvs.create false
      - poetry install --no-interaction --no-ansi
      - cd -

  pre_build:
    commands:
      - echo "Ejecutando pruebas unitarias..."
      - |
        if [ ! -f "${PROJECT_DIR}/.env" ] && [ -f "${PROJECT_DIR}/.env.example" ]; then
          cp "${PROJECT_DIR}/.env.example" "${PROJECT_DIR}/.env"
        fi
      - export PYTHONPATH="${PWD}/${PROJECT_DIR}/src:${PYTHONPATH}}"
      - python -m pytest -q ${UNIT_TESTS_DIR} || exit 1

      - echo "Autenticando en Amazon ECR..."
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com
      - export REPO_URI=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${ECR_REPO}

  build:
    commands:
      - echo "Construyendo imagen Docker..."
      - docker build -t ${ECR_REPO}:${IMAGE_TAG} ${PROJECT_DIR}
      - docker tag ${ECR_REPO}:${IMAGE_TAG} ${REPO_URI}:${IMAGE_TAG}

  post_build:
    commands:
      - echo "Subiendo imagen a ECR..."
      - docker push ${REPO_URI}:${IMAGE_TAG}

      - echo "Creando CloudWatch Log Group si no existe..."
      - aws logs create-log-group --log-group-name "/ecs/blacklist" --region ${REGION} || echo "Log group ya existe"

      - echo "Creando taskdef.json para CodeDeploy..."
      - |
        cat <<EOF > taskdef.json
        {
          "family": "blacklist",
          "executionRoleArn": "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole",
          "taskRoleArn": "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskRole",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "256",
          "memory": "512",
          "containerDefinitions": [
            {
              "name": "${CONTAINER_NAME}",
              "image": "${REPO_URI}:${IMAGE_TAG}",
              "essential": true,
              "portMappings": [
                {
                  "containerPort": 8080,
                  "protocol": "tcp"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/blacklist",
                  "awslogs-region": "${REGION}",
                  "awslogs-stream-prefix": "ecs"
                }
              }
            }
          ]
        }
        EOF

      - echo "Creando appspec.yaml para CodeDeploy..."
      - |
        cat > appspec.yaml << 'EOF'
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::ECS::Service
              Properties:
                TaskDefinition: <TASK_DEFINITION>
                LoadBalancerInfo:
                  ContainerName: "blacklist-container"
                  ContainerPort: 8080
        Hooks:
          - AfterAllowTestTraffic: "scripts/start_application"
        EOF

      - echo "Haciendo scripts ejecutables..."
      - chmod +x scripts/*

      - echo "Validando archivos generados..."
      - echo "=== taskdef.json ==="
      - cat taskdef.json
      - echo "=== appspec.yaml ==="
      - cat appspec.yaml
      - echo "Validando JSON..."
      - python -m json.tool taskdef.json > /dev/null && echo "✅ taskdef.json válido" || (echo "❌ taskdef.json inválido" && exit 1)

artifacts:
  files:
    - appspec.yaml
    - taskdef.json
    - scripts/**/*
