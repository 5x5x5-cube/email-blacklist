version: "3"

services:
  app:
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/blacklist_db
      - BEARER_TOKEN=dev-token-12345

  db:
    image: postgres:14
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blacklist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

